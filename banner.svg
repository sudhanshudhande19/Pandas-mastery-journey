<svg viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="50%" stop-color="#203a43"/>
      <stop offset="100%" stop-color="#2c5364"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7CFC9E"/>
      <stop offset="100%" stop-color="#2ecc71"/>
    </linearGradient>
    <filter id="shadow3d" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="0" flood-color="#0b3d1f" flood-opacity="1"/>
      <feDropShadow dx="0" dy="10" stdDeviation="0" flood-color="#082f18" flood-opacity="0.9"/>
      <feDropShadow dx="0" dy="14" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="260" fill="url(#bg)"/>
  <rect width="1200" height="260" fill="url(#grid)"/>

  <circle cx="1080" cy="60" r="90" fill="#2ecc71" opacity="0.08"/>
  <circle cx="120" cy="210" r="110" fill="#2ecc71" opacity="0.06"/>

  <text x="600" y="120" text-anchor="middle" font-family="Verdana, Arial, sans-serif"
        font-size="72" font-weight="bold" fill="url(#textGrad)" filter="url(#shadow3d)"
        letter-spacing="2">
    🐼 Pandas Mastery Journey
  </text>

  <text x="600" y="170" text-anchor="middle" font-family="Verdana, Arial, sans-serif"
        font-size="26" fill="#e0f7ec" opacity="0.9">
    A 10-Day Roadmap to Mastering Data Analysis with Pandas
  </text>

  <g font-family="Verdana, Arial, sans-serif" font-size="16" fill="#9be7b5">
    <text x="600" y="210" text-anchor="middle">DataFrames • Series • Cleaning • GroupBy • Merging • Pivot • Time Series • Strings • Apply/Map • Mini Project</text>
  </g>

  <rect x="0" y="252" width="1200" height="8" fill="#2ecc71" opacity="0.6"/>
</svg>
